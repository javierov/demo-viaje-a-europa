<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>App no disponible</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c0f;color:#eef1f5;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}h1{font-size:22px;margin:0 0 8px}p{color:#a2abba;margin:0}</style>
<script>

if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));
if(window.caches)caches.keys().then(k=>k.forEach(n=>caches.delete(n)));
</script></head>
<body><div><h1>Esta app ya no está disponible</h1><p>Gracias por tu interés.</p></div></body></html>
